<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Food Classifier — CT6057NI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f14;
    --surface:   #151820;
    --border:    #252a35;
    --accent:    #f97316;
    --accent2:   #fb923c;
    --text:      #e8eaf0;
    --muted:     #6b7280;
    --success:   #22c55e;
    --radius:    14px;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(249,115,22,0.12), transparent),
      radial-gradient(ellipse 40% 30% at 80% 80%, rgba(249,115,22,0.05), transparent);
  }

  header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(249,115,22,0.3);
    padding: 4px 12px;
    border-radius: 100px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 40%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  .card {
    width: 100%;
    max-width: 760px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px;
    animation: fadeUp 0.6s ease 0.1s both;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .model-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 32px;
  }

  .model-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
  }

  .model-btn:hover { border-color: var(--accent); color: var(--text); }

  .model-btn.active {
    border-color: var(--accent);
    background: rgba(249,115,22,0.08);
    color: var(--accent);
  }

  .model-btn .model-name {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: inherit;
    display: block;
    margin-bottom: 4px;
  }

  .model-btn .model-tag { font-size: 10px; opacity: 0.7; }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    background: var(--bg);
    margin-bottom: 20px;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(249,115,22,0.04);
  }

  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon { font-size: 40px; margin-bottom: 12px; display: block; }

  .drop-text { font-size: 14px; color: var(--muted); }
  .drop-text span { color: var(--accent); text-decoration: underline; }

  #preview-wrap {
    display: none;
    margin-bottom: 20px;
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  #preview-img { width: 100%; max-height: 300px; object-fit: cover; display: block; }

  .preview-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 10px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    font-size: 11px;
    color: rgba(255,255,255,0.6);
  }

  .clear-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.6);
    border: none;
    border-radius: 50%;
    width: 28px; height: 28px;
    cursor: pointer;
    color: #fff;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .clear-btn:hover { background: rgba(239,68,68,0.8); }

  .classify-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .classify-btn:hover:not(:disabled) {
    background: var(--accent2);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(249,115,22,0.3);
  }

  .classify-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #results-wrap {
    margin-top: 32px;
    display: none;
    animation: fadeUp 0.4s ease both;
  }

  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .results-model-tag {
    font-size: 11px;
    color: var(--accent);
    border: 1px solid rgba(249,115,22,0.3);
    padding: 3px 10px;
    border-radius: 100px;
  }

  .result-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }

  .result-item.top {
    border-color: var(--accent);
    background: rgba(249,115,22,0.06);
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .result-label { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
  .result-item.top .result-label { color: var(--accent); }
  .result-conf { font-size: 13px; font-weight: 500; color: var(--muted); }
  .result-item.top .result-conf { color: var(--accent); }

  .bar-bg { height: 5px; background: var(--border); border-radius: 100px; overflow: hidden; }

  .bar-fill {
    height: 100%;
    border-radius: 100px;
    background: var(--muted);
    transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
  }

  .result-item.top .bar-fill { background: var(--accent); }

  .top-badge {
    font-size: 10px;
    background: var(--accent);
    color: #fff;
    padding: 2px 8px;
    border-radius: 100px;
    margin-left: 8px;
    vertical-align: middle;
    font-family: 'DM Mono', monospace;
  }

  .error-box {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 10px;
    padding: 14px 18px;
    color: #f87171;
    font-size: 13px;
    margin-top: 20px;
    display: none;
  }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.5px;
    animation: fadeUp 0.6s ease 0.3s both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 520px) {
    .model-grid { grid-template-columns: 1fr; }
    .card { padding: 24px 18px; }
  }
</style>
</head>
<body>

<header>
  
  <h1>Food Classifier</h1>
  
</header>

<div class="card">

  <!-- Model Selector -->
  <p class="section-label">Select Model</p>
  <div class="model-grid">
    <button class="model-btn" data-model="baseline" onclick="selectModel(this)">
      <span class="model-name">Baseline CNN</span>
      <span class="model-tag">from scratch </span>
    </button>
    <button class="model-btn" data-model="improved" onclick="selectModel(this)">
      <span class="model-name">Improved CNN</span>
      <span class="model-tag">fine tuned</span>
    </button>
    <button class="model-btn active" data-model="pretrained" onclick="selectModel(this)">
      <span class="model-name">ResNet-50</span>
      <span class="model-tag">pre-trained </span>
    </button>
  </div>

  
  <p class="section-label"> Upload Image</p>
  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])"/>
    
    <p class="drop-text">Drop a food photo here or <span>click to browse</span></p>
    <p class="drop-text" style="font-size:11px; margin-top:6px;">JPG, PNG, WEBP supported</p>
  </div>
 
  <div id="preview-wrap">
    <img id="preview-img" src="" alt="Preview"/>
    <div class="preview-overlay" id="preview-name"></div>
    <button class="clear-btn" onclick="clearImage()" title="Remove">✕</button>
  </div>

  
  <button class="classify-btn" id="classify-btn" onclick="classify()" disabled>
    Classify Image
  </button>

  
  <div class="error-box" id="error-box"></div>

  
  <div id="results-wrap">
    <div class="results-header">
      <p class="section-label" style="margin:0">03 — Results</p>
      <span class="results-model-tag" id="results-model-tag"></span>
    </div>
    <div id="results-list"></div>
  </div>

</div>

<footer>
  
</footer>

<script>
  let selectedModel = "pretrained";
  let imageB64      = null;

  function selectModel(btn) {
    document.querySelectorAll(".model-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedModel = btn.dataset.model;
  }

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      imageB64 = e.target.result;
      document.getElementById("preview-img").src = imageB64;
      document.getElementById("preview-name").textContent = file.name;
      document.getElementById("preview-wrap").style.display = "block";
      document.getElementById("drop-zone").style.display    = "none";
      document.getElementById("classify-btn").disabled      = false;
      document.getElementById("results-wrap").style.display = "none";
      document.getElementById("error-box").style.display    = "none";
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    imageB64 = null;
    document.getElementById("preview-wrap").style.display  = "none";
    document.getElementById("drop-zone").style.display     = "block";
    document.getElementById("classify-btn").disabled       = true;
    document.getElementById("results-wrap").style.display  = "none";
    document.getElementById("error-box").style.display     = "none";
    document.getElementById("file-input").value            = "";
  }

  async function classify() {
    if (!imageB64) return;

    const btn = document.getElementById("classify-btn");
    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner"></span> Classifying...';

    document.getElementById("error-box").style.display    = "none";
    document.getElementById("results-wrap").style.display = "none";

    try {
      const res  = await fetch("/predict", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ model: selectedModel, image: imageB64 }),
      });
      const data = await res.json();

      if (!data.success) throw new Error(data.error);

      document.getElementById("results-model-tag").textContent = data.model;
      const list = document.getElementById("results-list");
      list.innerHTML = "";

      data.results.forEach((r, i) => {
        const item = document.createElement("div");
        item.className = "result-item" + (i === 0 ? " top" : "");
        item.innerHTML = `
          <div class="result-row">
            <span class="result-label">
              ${r.label}
              ${i === 0 ? '<span class="top-badge">TOP</span>' : ""}
            </span>
            <span class="result-conf">${r.confidence}%</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill" style="width: 0%" data-width="${r.confidence}"></div>
          </div>`;
        list.appendChild(item);
      });

      document.getElementById("results-wrap").style.display = "block";

      requestAnimationFrame(() => {
        document.querySelectorAll(".bar-fill").forEach(bar => {
          bar.style.width = bar.dataset.width + "%";
        });
      });

    } catch (err) {
      const box = document.getElementById("error-box");
      box.textContent   = "⚠ " + err.message;
      box.style.display = "block";
    } finally {
      btn.disabled  = false;
      btn.innerHTML = "Classify Image";
    }
  }

  // Drag & drop
  const dz = document.getElementById("drop-zone");
  dz.addEventListener("dragover",  e => { e.preventDefault(); dz.classList.add("drag-over"); });
  dz.addEventListener("dragleave", ()  => dz.classList.remove("drag-over"));
  dz.addEventListener("drop", e => {
    e.preventDefault();
    dz.classList.remove("drag-over");
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith("image/")) handleFile(file);
  });
</script>
</body>
</html>
